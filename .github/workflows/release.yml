name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.22.0)'
        required: true
        default: 'v0.22.0'
      draft:
        description: 'Create as draft release?'
        type: boolean
        default: false
      prerelease:
        description: 'Create as pre-release?'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x VirtualApp/gradlew

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true


      - name: Build Release APKs
        run: |
          cd VirtualApp
          ./gradlew assembleAospRelease --stacktrace

      - name: Prepare Release Assets
        id: prepare_assets
        run: |
          mkdir -p release_assets
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          
          # Copy and rename generated APKs with version tag
          find VirtualApp/app/build/outputs/apk/aosp/release -name "*.apk" -exec cp {} release_assets/VirtualXposed-${TAG}.apk \; || true
          
          # Fallback if specific flavor directory varies
          if [ ! -f release_assets/VirtualXposed-${TAG}.apk ]; then
            find VirtualApp/app/build/outputs/apk -name "*release*.apk" -exec cp {} release_assets/VirtualXposed-${TAG}.apk \;
          fi
          
          echo "Assets prepared:"
          ls -la release_assets/

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "VirtualXposed ${{ github.event.inputs.tag_name || github.ref_name }}"
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            release_assets/*.apk
