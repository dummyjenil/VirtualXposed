apply plugin: 'com.android.library'

android {
    namespace = 'com.lody.virtual'
    compileSdk = 36
    ndkVersion = "27.0.12077973"
    buildToolsVersion = "36.0.0"

    defaultConfig {
        minSdk = 21
        targetSdk = 36
        externalNativeBuild {
            ndkBuild {
                abiFilters "arm64-v8a", "x86_64"
            }
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path file("src/main/jni/Android.mk")
        }
    }
    lint {
        warning 'NewApi', 'OnClick'
        checkReleaseBuilds = false
        abortOnError = false
    }
    buildFeatures {
        aidl = true
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // Modern Android 9-15+ Hidden API Bypass (LSPosed component)
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'

    // LSPosed ART Hooking Core Engine (Pine & Xposed API)
    implementation 'top.canyie.pine:core:0.2.7'
    implementation 'top.canyie.pine:xposed:0.0.9'
    compileOnly 'de.robv.android.xposed:api:82'
}


repositories {
    google()
    mavenCentral()
    mavenLocal()
    maven { url = uri('https://jitpack.io') }
    maven { url = uri('https://maven.aliyun.com/repository/public') }
    maven { url = uri('https://maven.aliyun.com/repository/jcenter') }
    maven { url = uri('https://jcenter.bintray.com') }
    maven { url = uri('https://raw.githubusercontent.com/tiann/epic/master/repository') }
    maven { url = uri('https://raw.githubusercontent.com/android-hacker/exposed/master/repository') }
}




