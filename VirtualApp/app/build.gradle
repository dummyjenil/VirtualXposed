apply plugin: 'com.android.application'

Properties properties = new Properties()
def localProp = file(project.rootProject.file('local.properties'))
if (localProp.exists()) {
    properties.load(localProp.newDataInputStream())
}
def keyFile = file(properties.getProperty("keystore.path") ?: "/tmp/does_not_exist")

android {
    namespace = 'io.virtualapp'
    signingConfigs {
        config {
            keyAlias = properties.getProperty("keystore.alias")
            keyPassword = properties.getProperty("keystore.pwd")
            storeFile = keyFile
            storePassword = properties.getProperty("keystore.alias_pwd")
        }
    }

    compileSdk = 36
    ndkVersion = "27.0.12077973"
    buildToolsVersion = "36.0.0"

    defaultConfig {
        applicationId = "io.va.exposed64"
        minSdk = 21
        targetSdk = 36
        versionCode = 220
        versionName = "0.22.0"
        multiDexEnabled = true
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    flavorDimensions = ['main']
    productFlavors {
        aosp {
            dimension = 'main'
            if (keyFile.exists()) {
                signingConfig = signingConfigs.config
            }
        }

        fdroid {
            dimension = 'main'
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
    buildTypes {
        release {
            minifyEnabled = false
            debuggable = false
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }
}


dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(':lib')
    // implementation project(':launcher')

    // AndroidX Libraries
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.fragment:fragment:1.8.6'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.12.0'

    // Promise Support
    implementation 'org.jdeferred:jdeferred-android-aar:1.2.6'

    // ThirdParty
    implementation 'com.jonathanfinerty.once:once:1.3.1'

    def appCenterSdkVersion = '5.0.5'
    aospImplementation("com.microsoft.appcenter:appcenter-analytics:${appCenterSdkVersion}")
    aospImplementation("com.microsoft.appcenter:appcenter-crashes:${appCenterSdkVersion}")

    implementation 'com.kyleduo.switchbutton:library:1.4.6'
    implementation 'com.allenliu.versionchecklib:library:1.8.3'
    implementation 'com.github.medyo:android-about-page:1.2.6'
    implementation 'moe.feng:AlipayZeroSdk:1.1'


    implementation 'me.weishu.exposed:exposed-core:0.8.1'

    // Glide
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
}


repositories {
    google()
    mavenCentral()
    mavenLocal()
    maven { url = uri('https://jitpack.io') }
    maven { url = uri('https://maven.aliyun.com/repository/public') }
    maven { url = uri('https://maven.aliyun.com/repository/jcenter') }
    maven { url = uri('https://jcenter.bintray.com') }
    maven { url = uri('https://raw.githubusercontent.com/tiann/epic/master/repository') }
    maven { url = uri('https://raw.githubusercontent.com/android-hacker/exposed/master/repository') }
}


